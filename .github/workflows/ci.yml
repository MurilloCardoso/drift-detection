name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run drift-detect demo
      - run: uv run drift-detect drift
      - run: uv run drift-detect monitor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-evidence
          path: |
            artifacts/reports/
            artifacts/observability/
            artifacts/predictions/

